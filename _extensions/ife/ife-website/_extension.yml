title: IFE Website
author: IFE
version: 0.1.0
quarto-required: ">=1.9.38"

contributes:
  # ------ Project Type: IFE Website -------------------------------------------
  # Defaults partagés : favicon et bandeau de cookies.
  project:
    project:
      type: website
    website:
      title: "IFE"
      favicon: "img/IFE_logo_anthracite.ico"
      cookie-consent:
        type: express
        style: simple
        palette: light
        language: fr
        policy-url: https://ife.eco/legal/cookies.html
      # GA n'est pas déclaré via google-analytics : Quarto chargerait gtag.js
      # avant le consentement. Voir ife/html/analytics.html.
      navbar: false

  shortcodes:
    - home/bandeauinformatif.lua
    - home/quisommesnous.lua
    - home/alaune.lua
    - home/ecograph.lua
    - home/actualite.lua
    - home/publications.lua
    - home/outils.lua
    - home/apropos.lua
